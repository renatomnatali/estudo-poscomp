<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Usuários VIP</title>
  <style>
    body { margin: 0; font-family: "DM Sans", sans-serif; background: #f3f6ff; color: #0f172a; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 16px; }
    .card { background: #fff; border: 1px solid #dbe3f3; border-radius: 14px; padding: 16px; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 0; color: #64748b; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    input, select, button { border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px 10px; font: inherit; }
    button { background: #fff; cursor: pointer; }
    button.primary { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .92rem; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 10px 8px; text-align: left; }
    th { color: #64748b; font-weight: 600; }
    .pill { display: inline-flex; border-radius: 999px; padding: 2px 8px; font-size: .74rem; font-weight: 700; }
    .free { background: #e2e8f0; color: #334155; }
    .premium { background: #dbeafe; color: #1e40af; }
    .vip { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Administração de Acesso Premium</h1>
      <p>Gestão operacional de usuários Free/Premium/VIP com ações de concessão e revogação de VIP.</p>
      <div class="filters">
        <input type="search" placeholder="Buscar por e-mail ou userId" />
        <select>
          <option>Todos</option>
          <option>Free</option>
          <option>Premium Pago</option>
          <option>VIP</option>
        </select>
        <button class="primary">Atualizar lista</button>
      </div>
    </section>

    <section class="card">
      <table>
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Plano</th>
            <th>Origem</th>
            <th>Expira em</th>
            <th>Ação VIP</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>renatomnatali@gmail.com</td>
            <td><span class="pill vip">Plano VIP</span></td>
            <td>vip</td>
            <td>—</td>
            <td><button>Desmarcar VIP</button></td>
          </tr>
          <tr>
            <td>ana@example.com</td>
            <td><span class="pill premium">Plano Premium</span></td>
            <td>billing</td>
            <td>2026-04-10</td>
            <td><button disabled>VIP não necessário</button></td>
          </tr>
          <tr>
            <td>joao@example.com</td>
            <td><span class="pill free">Plano Free</span></td>
            <td>none</td>
            <td>—</td>
            <td><button class="primary">Marcar VIP</button></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
