<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:var(--bg-2);">
  <span class="eyebrow">Components · Stat &amp; module cards</span>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--n-200);border:1px solid var(--n-200);border-radius:20px;overflow:hidden;">
    <div style="background:#fff;padding:14px;text-align:center;"><div class="tabular" style="font-family:var(--fb);font-size:1.65rem;font-weight:700;color:var(--sap);line-height:1;">25</div><div style="font-size:11px;color:var(--n-500);margin-top:4px;">tópicos do edital</div></div>
    <div style="background:#fff;padding:14px;text-align:center;"><div class="tabular" style="font-family:var(--fb);font-size:1.65rem;font-weight:700;color:var(--sap);line-height:1;">9</div><div style="font-size:11px;color:var(--n-500);margin-top:4px;">módulos de F6</div></div>
    <div style="background:#fff;padding:14px;text-align:center;"><div class="tabular" style="font-family:var(--fb);font-size:1.65rem;font-weight:700;color:var(--sap);line-height:1;">70</div><div style="font-size:11px;color:var(--n-500);margin-top:4px;">questões no simulado</div></div>
    <div style="background:#fff;padding:14px;text-align:center;"><div class="tabular" style="font-family:var(--fb);font-size:1.65rem;font-weight:700;color:var(--sap);line-height:1;">100%</div><div style="font-size:11px;color:var(--n-500);margin-top:4px;">edital SBC oficial</div></div>
  </div>
  <div style="background:#fff;border:1px solid var(--n-200);border-radius:24px;padding:18px;box-shadow:var(--sh-sm);">
    <div style="width:40px;height:40px;border-radius:12px;background:var(--sap-bg);display:flex;align-items:center;justify-content:center;font-size:1.2rem;">🔬</div>
    <div style="font-family:var(--fd);font-weight:700;font-size:1rem;margin-top:12px;color:var(--ink);">Visualizações interativas</div>
    <div style="font-size:13px;color:var(--n-500);margin-top:4px;line-height:1.55;">Autômatos que animam, diagramas clicáveis. Teoria que você vê funcionando.</div>
  </div>
</div></body></html>
