<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:var(--bg-2);">
  <span class="eyebrow">Elevation</span>
  <div style="display:flex;gap:18px;align-items:flex-end;flex:1;">
    <div style="text-align:center;flex:1;"><div style="height:74px;background:var(--white);border-radius:12px;box-shadow:var(--sh-xs);"></div><div style="font-family:var(--fm);font-size:10.5px;margin-top:8px;color:var(--fg-3);">sh-xs</div></div>
    <div style="text-align:center;flex:1;"><div style="height:74px;background:var(--white);border-radius:12px;box-shadow:var(--sh-sm);"></div><div style="font-family:var(--fm);font-size:10.5px;margin-top:8px;color:var(--fg-3);">sh-sm · cards</div></div>
    <div style="text-align:center;flex:1;"><div style="height:74px;background:var(--white);border-radius:12px;box-shadow:var(--sh-md);"></div><div style="font-family:var(--fm);font-size:10.5px;margin-top:8px;color:var(--fg-3);">sh-md · hover</div></div>
    <div style="text-align:center;flex:1;"><div style="height:74px;background:var(--white);border-radius:12px;box-shadow:var(--sh-lg);"></div><div style="font-family:var(--fm);font-size:10.5px;margin-top:8px;color:var(--fg-3);">sh-lg · float / modal</div></div>
    <div style="text-align:center;flex:1;"><div style="height:74px;background:var(--sap);border-radius:12px;box-shadow:var(--sh-cta);"></div><div style="font-family:var(--fm);font-size:10.5px;margin-top:8px;color:var(--fg-3);">sh-cta · sap glow</div></div>
  </div>
  <p style="font-size:11.5px;color:var(--fg-3);line-height:1.5;">Shadows are <strong style="color:var(--fg-1);">soft and ink-tinted</strong> (rgba 10,15,30). CTAs get a sapphire glow that intensifies on hover. Never combine elevation with a heavy border — pick one.</p>
</div></body></html>
