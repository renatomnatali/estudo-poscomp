<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <span class="eyebrow">Components · Badges &amp; chips</span>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
    <span style="font-family:var(--fm);font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;background:var(--em-bg);color:#006B50;padding:.18rem .55rem;border-radius:9999px;">Free ✓</span>
    <span style="font-family:var(--fm);font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;background:var(--n-100);color:var(--n-400);padding:.18rem .55rem;border-radius:9999px;">Premium</span>
    <span style="font-family:var(--fm);font-size:10.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;background:var(--sap-bg);color:var(--sap);padding:.22rem .65rem;border-radius:9999px;">Como funciona</span>
    <span style="font-family:var(--fm);font-size:10.5px;font-weight:500;background:var(--amb-bg);color:#92400E;padding:.22rem .55rem;border-radius:9999px;">⏱ Streak 6d</span>
    <span style="font-family:var(--fm);font-size:10.5px;font-weight:500;background:var(--coral-bg);color:#9F1F12;padding:.22rem .55rem;border-radius:9999px;">Errei</span>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
    <span style="font-family:var(--fb);font-size:11px;color:var(--n-500);background:var(--n-100);padding:2px 9px;border-radius:9999px;">~35 min</span>
    <span style="font-family:var(--fb);font-size:11px;color:var(--n-500);background:var(--n-100);padding:2px 9px;border-radius:9999px;">Iniciante</span>
    <span style="font-family:var(--fb);font-size:11px;color:var(--n-500);background:var(--n-100);padding:2px 9px;border-radius:9999px;">5 exercícios</span>
    <span style="font-family:var(--fd);font-size:13px;font-weight:700;color:var(--n-400);padding:.25rem .8rem;border:1px solid var(--n-200);border-radius:9999px;">Sipser 3ª ed.</span>
    <span style="font-family:var(--fd);font-size:13px;font-weight:700;color:var(--n-400);padding:.25rem .8rem;border:1px solid var(--n-200);border-radius:9999px;">Edital SBC 2025</span>
  </div>
  <div style="background:var(--ink);padding:14px;border-radius:12px;display:inline-flex;gap:8px;align-items:center;width:fit-content;">
    <span style="display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:9999px;padding:.3rem .8rem;font-family:var(--fm);font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.65);">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--em);"></span>Baseado no edital SBC 2025
    </span>
  </div>
</div></body></html>
