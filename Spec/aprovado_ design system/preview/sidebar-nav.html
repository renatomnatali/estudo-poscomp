<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:var(--bg-2);">
  <span class="eyebrow">Components · Sidebar nav</span>
  <div style="background:#fff;border:1px solid var(--n-200);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;width:240px;box-shadow:var(--sh-xs);">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:.55rem .75rem;border-radius:10px;color:var(--n-600);font-size:13px;">
      <span style="font-weight:500;">Dashboard</span><span style="font-size:11px;opacity:.7;">📊</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:.55rem .75rem;border-radius:10px;color:var(--n-600);font-size:13px;">
      <span style="font-weight:500;">Tópicos</span><span style="font-size:11px;opacity:.7;">📚</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:.55rem .75rem;border-radius:10px;background:var(--sap-bg);border:1px solid var(--sap-bg-2);color:var(--sap-d);font-size:13px;font-weight:700;">
      <span>Simulador</span><span style="font-size:11px;">🎮</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:.55rem .75rem;border-radius:10px;color:var(--n-600);font-size:13px;">
      <span style="font-weight:500;">Flashcards</span><span style="font-size:11px;opacity:.7;">🃏</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:.55rem .75rem;border-radius:10px;color:var(--n-600);font-size:13px;">
      <span style="font-weight:500;">Premium</span><span style="font-size:11px;opacity:.7;">⭐</span>
    </div>
  </div>
  <small style="font-family:var(--fm);font-size:10.5px;color:var(--fg-4);margin-top:auto;">Active item gets sap-bg surface + sap-bg-2 border + sap-d text. Right-aligned emoji icon at 0.7 opacity.</small>
</div></body></html>
