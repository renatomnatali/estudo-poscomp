<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:var(--ink);background-image:var(--grad-dotgrid);background-size:var(--dotgrid-size);">
  <span class="eyebrow" style="color:rgba(255,255,255,.45);">Components · Floating toasts</span>
  <div style="display:flex;gap:12px;flex-wrap:wrap;">
    <div style="background:rgba(0,179,126,.16);border:1px solid rgba(0,179,126,.28);border-radius:12px;padding:.7rem .9rem;display:flex;align-items:center;gap:.5rem;backdrop-filter:blur(12px);">
      <span style="font-size:18px;">✓</span>
      <span style="font-size:13px;color:rgba(255,255,255,.78);font-weight:500;">
        <strong style="display:block;color:#fff;font-weight:700;font-size:13.5px;">Módulo concluído</strong>
        Pumping Lemma — F6
      </span>
    </div>
    <div style="background:rgba(27,63,216,.16);border:1px solid rgba(27,63,216,.28);border-radius:12px;padding:.7rem .9rem;display:flex;align-items:center;gap:.5rem;backdrop-filter:blur(12px);">
      <span style="font-size:18px;">⏱</span>
      <span style="font-size:13px;color:rgba(255,255,255,.78);font-weight:500;">
        <strong style="display:block;color:#fff;font-weight:700;font-size:13.5px;">Simulado pronto</strong>
        20 questões · 45 min
      </span>
    </div>
    <div style="background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.32);border-radius:12px;padding:.7rem .9rem;display:flex;align-items:center;gap:.5rem;backdrop-filter:blur(12px);">
      <span style="font-size:18px;">🔥</span>
      <span style="font-size:13px;color:rgba(255,255,255,.78);font-weight:500;">
        <strong style="display:block;color:#fff;font-weight:700;font-size:13.5px;">Streak: 6 dias</strong>
        Continue amanhã para chegar a 7
      </span>
    </div>
  </div>
  <small style="font-family:var(--fm);font-size:10px;color:rgba(255,255,255,.4);margin-top:auto;">Glass cards: tinted bg (em/sap/amb) at 16-18% alpha · matching border at 28-32% · backdrop-blur 12px · subtle float animation.</small>
</div></body></html>
