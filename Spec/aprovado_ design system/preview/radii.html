<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <span class="eyebrow">Radii</span>
  <div style="display:flex;gap:14px;align-items:flex-end;">
    <div style="text-align:center;"><div style="width:64px;height:64px;background:var(--sap-bg);border:1px solid var(--sap-bg-2);border-radius:6px;"></div><div style="font-family:var(--fm);font-size:10.5px;margin-top:6px;color:var(--fg-3);">sm · 6</div></div>
    <div style="text-align:center;"><div style="width:64px;height:64px;background:var(--sap-bg);border:1px solid var(--sap-bg-2);border-radius:12px;"></div><div style="font-family:var(--fm);font-size:10.5px;margin-top:6px;color:var(--fg-3);">md · 12</div></div>
    <div style="text-align:center;"><div style="width:64px;height:64px;background:var(--sap-bg);border:1px solid var(--sap-bg-2);border-radius:16px;"></div><div style="font-family:var(--fm);font-size:10.5px;margin-top:6px;color:var(--fg-3);">lg · 16</div></div>
    <div style="text-align:center;"><div style="width:64px;height:64px;background:var(--sap-bg);border:1px solid var(--sap-bg-2);border-radius:24px;"></div><div style="font-family:var(--fm);font-size:10.5px;margin-top:6px;color:var(--fg-3);">xl · 24</div></div>
    <div style="text-align:center;"><div style="width:128px;height:36px;background:var(--sap-bg);border:1px solid var(--sap-bg-2);border-radius:9999px;"></div><div style="font-family:var(--fm);font-size:10.5px;margin-top:6px;color:var(--fg-3);">pill · 9999</div></div>
  </div>
  <p style="font-size:12px;color:var(--fg-3);margin-top:auto;line-height:1.55;"><strong style="color:var(--fg-1);">Use:</strong> <code>sm</code> small chips/inputs · <code>md</code> buttons & inline cards · <code>lg</code> module cards · <code>xl</code> hero / feature cards · <code>pill</code> CTAs, tags, status badges. Never mix more than two radii in one component.</p>
</div></body></html>
