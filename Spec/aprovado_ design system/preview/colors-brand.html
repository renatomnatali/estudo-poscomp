<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <span class="eyebrow">Color · Brand core</span>
  <div class="row" style="gap:10px;">
    <div class="swatch has-text-dark" style="background:var(--ink);">
      <span class="name">Ink</span><span class="hex">#0A0F1E</span>
    </div>
    <div class="swatch has-text-dark" style="background:var(--sap);">
      <span class="name">Sapphire · Primary</span><span class="hex">#1B3FD8</span>
    </div>
    <div class="swatch has-text-dark" style="background:var(--em);">
      <span class="name">Emerald · Free / OK</span><span class="hex">#00B37E</span>
    </div>
    <div class="swatch has-text-dark" style="background:var(--amb);">
      <span class="name">Amber · Streak</span><span class="hex">#F59E0B</span>
    </div>
    <div class="swatch has-text-dark" style="background:var(--coral);">
      <span class="name">Coral · Wrong</span><span class="hex">#F04E37</span>
    </div>
  </div>
  <div class="row" style="gap:10px;">
    <div class="swatch" style="background:var(--sap-bg);"><span class="name">sap-bg</span><span class="hex">#EEF1FF</span></div>
    <div class="swatch" style="background:var(--em-bg);"><span class="name">em-bg</span><span class="hex">#E6FBF4</span></div>
    <div class="swatch" style="background:var(--amb-bg);"><span class="name">amb-bg</span><span class="hex">#FEF3C7</span></div>
    <div class="swatch" style="background:var(--coral-bg);"><span class="name">coral-bg</span><span class="hex">#FEE2E2</span></div>
    <div class="swatch has-text-dark" style="background:linear-gradient(135deg,var(--sap),var(--em));"><span class="name">grad-logo</span><span class="hex">sap → em</span></div>
  </div>
</div></body></html>
