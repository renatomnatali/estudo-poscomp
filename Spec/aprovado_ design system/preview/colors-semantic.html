<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <span class="eyebrow">Color · Semantic uses</span>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <div style="border:1px solid var(--border-1);border-radius:12px;padding:12px 14px;background:var(--em-bg);">
      <div style="display:flex;align-items:center;gap:8px;"><span style="width:10px;height:10px;border-radius:50%;background:var(--em);"></span><strong style="font-size:13px;color:#006B50;font-family:var(--fb);">Free / Acerto</strong></div>
      <div style="font-size:11.5px;color:#006B50;margin-top:6px;font-family:var(--fm);">em · em-d · em-bg</div>
    </div>
    <div style="border:1px solid var(--border-1);border-radius:12px;padding:12px 14px;background:var(--sap-bg);">
      <div style="display:flex;align-items:center;gap:8px;"><span style="width:10px;height:10px;border-radius:50%;background:var(--sap);"></span><strong style="font-size:13px;color:var(--sap-d);font-family:var(--fb);">Primário / Estudando</strong></div>
      <div style="font-size:11.5px;color:var(--sap-d);margin-top:6px;font-family:var(--fm);">sap · sap-d · sap-l · sap-bg</div>
    </div>
    <div style="border:1px solid var(--border-1);border-radius:12px;padding:12px 14px;background:var(--amb-bg);">
      <div style="display:flex;align-items:center;gap:8px;"><span style="width:10px;height:10px;border-radius:50%;background:var(--amb);"></span><strong style="font-size:13px;color:#92400E;font-family:var(--fb);">Streak / Atenção</strong></div>
      <div style="font-size:11.5px;color:#92400E;margin-top:6px;font-family:var(--fm);">amb · amb-bg</div>
    </div>
    <div style="border:1px solid var(--border-1);border-radius:12px;padding:12px 14px;background:var(--coral-bg);">
      <div style="display:flex;align-items:center;gap:8px;"><span style="width:10px;height:10px;border-radius:50%;background:var(--coral);"></span><strong style="font-size:13px;color:#9F1F12;font-family:var(--fb);">Erro / Perdido</strong></div>
      <div style="font-size:11.5px;color:#9F1F12;margin-top:6px;font-family:var(--fm);">coral · coral-bg</div>
    </div>
  </div>
  <p style="font-size:12px;color:var(--fg-3);line-height:1.55;margin-top:auto;">Semantic colors always pair a saturated solid with its <code>-bg</code> tint. The tint is the surface, the solid is the dot/icon/accent.</p>
</div></body></html>
