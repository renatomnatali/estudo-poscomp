<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:var(--bg-2);">
  <span class="eyebrow">Components · Flashcard</span>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <article style="background:linear-gradient(160deg,#fff 0%,#F8F9FF 100%);border:1px solid var(--n-300);border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:170px;box-shadow:var(--sh-md);">
      <strong style="font-family:var(--fb);font-weight:600;font-size:18px;color:var(--ink);line-height:1.3;max-width:24ch;">O que é um autômato finito determinístico?</strong>
      <small style="margin-top:14px;font-size:11px;color:var(--n-500);font-family:var(--fb);">Toque para ver a resposta</small>
    </article>
    <article style="background:linear-gradient(160deg,#E6FBF4 0%,#EAF6FF 100%);border:1px solid #B8E5D6;border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:170px;box-shadow:var(--sh-md);">
      <strong style="font-family:Georgia,serif;font-weight:600;font-size:14px;color:var(--ink);line-height:1.4;">M = (E, Σ, δ, e₀, F)</strong>
      <p style="margin-top:8px;font-size:12px;color:#0F4F3F;line-height:1.5;">Quíntupla com estados, alfabeto, função de transição, estado inicial e finais.</p>
    </article>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button style="background:var(--coral-bg);color:#9F1F12;border:none;border-radius:10px;padding:.5rem 1rem;font-size:12.5px;font-weight:600;font-family:var(--fb);">Errei</button>
    <button style="background:var(--amb-bg);color:#92400E;border:none;border-radius:10px;padding:.5rem 1rem;font-size:12.5px;font-weight:600;font-family:var(--fb);">Difícil</button>
    <button style="background:var(--sap-bg);color:var(--sap-d);border:none;border-radius:10px;padding:.5rem 1rem;font-size:12.5px;font-weight:600;font-family:var(--fb);">Bom</button>
    <button style="background:var(--em);color:#fff;border:none;border-radius:10px;padding:.5rem 1rem;font-size:12.5px;font-weight:700;font-family:var(--fb);">Fácil</button>
  </div>
</div></body></html>
