<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:var(--ink);position:relative;overflow:hidden;padding:0;">
  <div style="position:absolute;inset:0;background:var(--grad-hero-radial);"></div>
  <div style="position:absolute;inset:0;background-image:var(--grad-dotgrid);background-size:var(--dotgrid-size);"></div>
  <div style="position:relative;z-index:1;padding:24px;display:flex;flex-direction:column;gap:14px;height:100%;">
    <span style="font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.45);">Brand motif · Hero treatment</span>
    <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:9999px;padding:.28rem .8rem;font-family:var(--fm);font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.65);width:fit-content;">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--em);"></span>Baseado no edital SBC 2025
    </div>
    <h1 style="font-family:var(--fd);font-weight:800;font-size:34px;line-height:1.08;color:#fff;letter-spacing:-.02em;margin:0;max-width:22ch;">
      Estude para o POSCOMP de um jeito que <span style="color:var(--em);">faz sentido</span>
    </h1>
    <p style="font-size:13px;color:rgba(255,255,255,.62);max-width:54ch;line-height:1.6;margin:0;">Trilhas visuais e interativas cobrindo os 25 tópicos do edital — autômatos animados, simulados reais, flashcards, tudo em português.</p>
  </div>
</div></body></html>
