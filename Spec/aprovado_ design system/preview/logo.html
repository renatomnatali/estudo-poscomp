<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <span class="eyebrow">Logo · Aprovado</span>
  <div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap;">

    <!-- Primary lockup · default size (38px ring, 8px gap) -->
    <div class="aprovado-lockup">
      <span class="aprovado-ring">✓</span>
      <span class="aprovado-word">aprov<span class="a">a</span>do</span>
    </div>

    <div style="width:1px;background:var(--border-1);align-self:stretch;"></div>

    <!-- Small (header / mobile) -->
    <div class="aprovado-lockup is-sm">
      <span class="aprovado-ring">✓</span>
      <span class="aprovado-word">aprov<span class="a">a</span>do</span>
    </div>

  </div>

  <!-- On dark -->
  <div style="background:var(--ink);padding:18px 22px;border-radius:14px;display:inline-flex;width:fit-content;background-image:var(--grad-dotgrid);background-size:var(--dotgrid-size);">
    <div class="aprovado-lockup on-dark">
      <span class="aprovado-ring">✓</span>
      <span class="aprovado-word">aprov<span class="a">a</span>do</span>
    </div>
  </div>

  <p style="font-size:12.5px;color:var(--fg-3);margin-top:auto;line-height:1.5;">
    Anel <code>em</code> 38px (= cap-height) com ring externo a 45% opacity, gap <code>8px</code>, segundo "a" em emerald. Lê como "<span style="font-family:var(--fd);font-weight:800;">✓ aprovado</span>" — selo + palavra. Domínio <code>aprovado.xyz</code>.
  </p>
</div></body></html>
