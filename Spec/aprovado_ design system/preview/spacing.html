<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <span class="eyebrow">Spacing · 4px grid</span>
  <div style="display:flex;flex-direction:column;gap:6px;font-family:var(--fm);font-size:11px;color:var(--fg-3);">
    <div style="display:flex;align-items:center;gap:10px;"><span style="width:46px;color:var(--fg-1);font-weight:600;">1 · 4</span><span style="height:10px;background:var(--sap);border-radius:2px;width:4px;"></span></div>
    <div style="display:flex;align-items:center;gap:10px;"><span style="width:46px;color:var(--fg-1);font-weight:600;">2 · 8</span><span style="height:10px;background:var(--sap);border-radius:2px;width:8px;"></span></div>
    <div style="display:flex;align-items:center;gap:10px;"><span style="width:46px;color:var(--fg-1);font-weight:600;">3 · 12</span><span style="height:10px;background:var(--sap);border-radius:2px;width:12px;"></span></div>
    <div style="display:flex;align-items:center;gap:10px;"><span style="width:46px;color:var(--fg-1);font-weight:600;">4 · 16</span><span style="height:10px;background:var(--sap);border-radius:2px;width:16px;"></span></div>
    <div style="display:flex;align-items:center;gap:10px;"><span style="width:46px;color:var(--fg-1);font-weight:600;">5 · 20</span><span style="height:10px;background:var(--sap);border-radius:2px;width:20px;"></span></div>
    <div style="display:flex;align-items:center;gap:10px;"><span style="width:46px;color:var(--fg-1);font-weight:600;">6 · 24</span><span style="height:10px;background:var(--sap);border-radius:2px;width:24px;"></span></div>
    <div style="display:flex;align-items:center;gap:10px;"><span style="width:46px;color:var(--fg-1);font-weight:600;">8 · 32</span><span style="height:10px;background:var(--sap);border-radius:2px;width:32px;"></span></div>
    <div style="display:flex;align-items:center;gap:10px;"><span style="width:46px;color:var(--fg-1);font-weight:600;">12 · 48</span><span style="height:10px;background:var(--sap);border-radius:2px;width:48px;"></span></div>
    <div style="display:flex;align-items:center;gap:10px;"><span style="width:46px;color:var(--fg-1);font-weight:600;">16 · 64</span><span style="height:10px;background:var(--sap);border-radius:2px;width:64px;"></span></div>
  </div>
</div></body></html>
