<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <span class="eyebrow">Components · Inputs</span>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;">
    <label style="display:flex;flex-direction:column;gap:6px;">
      <span style="font-size:11.5px;color:var(--sap-d);font-weight:600;font-family:var(--fb);">Linguagem</span>
      <input value="L = {a,b}*{c}" style="border:1px solid var(--n-200);border-radius:8px;padding:.5rem .65rem;font-family:var(--fm);font-size:13px;background:#F8FAFF;color:var(--ink);outline:none;">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;">
      <span style="font-size:11.5px;color:var(--sap-d);font-weight:600;font-family:var(--fb);">Palavra alvo</span>
      <input value="ababc" style="border:1.5px solid var(--sap);border-radius:8px;padding:.5rem .65rem;font-family:var(--fm);font-size:13px;background:#fff;color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(27,63,216,.12);">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;">
      <span style="font-size:11.5px;color:var(--sap-d);font-weight:600;font-family:var(--fb);">Dificuldade</span>
      <select style="border:1px solid var(--n-200);border-radius:8px;padding:.5rem .65rem;font-family:var(--fb);font-size:13px;background:#F8FAFF;color:var(--ink);">
        <option>Todas as áreas</option>
      </select>
    </label>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <span style="font-size:11.5px;color:var(--sap-d);font-weight:600;font-family:var(--fb);">Mostrar conhecidos</span>
      <span style="display:inline-flex;align-items:center;gap:8px;">
        <span style="display:inline-flex;width:54px;height:30px;background:#0EA5E9;border-radius:9999px;padding:3px;align-items:center;justify-content:flex-end;">
          <span style="width:24px;height:24px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);"></span>
        </span>
        <small style="color:var(--fg-3);font-size:12px;">Ativo</small>
      </span>
    </div>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;background:var(--n-50);border:1px solid var(--n-200);border-radius:12px;padding:8px;width:fit-content;">
    <kbd style="background:#fff;border:1px solid var(--n-300);border-radius:6px;padding:.3rem .55rem;font-family:var(--fm);font-size:13px;color:var(--ink);">a</kbd>
    <kbd style="background:#fff;border:1px solid var(--n-300);border-radius:6px;padding:.3rem .55rem;font-family:var(--fm);font-size:13px;color:var(--ink);">b</kbd>
    <kbd style="background:#fff;border:1px solid var(--n-300);border-radius:6px;padding:.3rem .55rem;font-family:var(--fm);font-size:13px;color:var(--ink);">c</kbd>
    <kbd style="background:var(--sap-bg);border:1px solid var(--sap-bg-2);border-radius:6px;padding:.3rem .55rem;font-family:var(--fm);font-size:13px;color:var(--sap-d);">δ</kbd>
    <kbd style="background:var(--sap-bg);border:1px solid var(--sap-bg-2);border-radius:6px;padding:.3rem .55rem;font-family:var(--fm);font-size:13px;color:var(--sap-d);">Σ</kbd>
    <kbd style="background:var(--sap-bg);border:1px solid var(--sap-bg-2);border-radius:6px;padding:.3rem .55rem;font-family:var(--fm);font-size:13px;color:var(--sap-d);">→</kbd>
  </div>
</div></body></html>
