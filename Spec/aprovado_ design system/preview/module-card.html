<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:var(--bg-2);">
  <span class="eyebrow">Components · Topic / module rows</span>
  <div style="background:#fff;border:1px solid var(--n-200);border-radius:16px;overflow:hidden;box-shadow:var(--sh-sm);">
    <div style="padding:11px 14px;border-bottom:1px solid var(--n-100);display:flex;align-items:center;gap:8px;">
      <span style="width:10px;height:10px;border-radius:50%;background:var(--sap);"></span>
      <span style="font-family:var(--fd);font-weight:700;font-size:13px;color:var(--ink);">Fundamentos da Computação</span>
      <span style="margin-left:auto;font-family:var(--fm);font-size:10px;color:var(--n-400);background:var(--n-100);padding:2px 9px;border-radius:9999px;">10 tópicos</span>
    </div>
    <div style="padding:6px 10px;">
      <div style="display:flex;align-items:center;gap:8px;padding:.45rem;border-bottom:1px solid var(--n-100);">
        <span style="width:24px;height:24px;border-radius:5px;background:var(--em);color:#fff;font-family:var(--fm);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;">F6</span>
        <span style="font-size:12.5px;color:var(--n-600);flex:1;">Linguagens Formais e Autômatos</span>
        <span style="font-family:var(--fm);font-size:10px;font-weight:600;background:var(--em-bg);color:#006B50;padding:2px 8px;border-radius:9999px;text-transform:uppercase;letter-spacing:1px;">Free ✓</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:.45rem;border-bottom:1px solid var(--n-100);">
        <span style="width:24px;height:24px;border-radius:5px;background:var(--n-300);color:#fff;font-family:var(--fm);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;">F1</span>
        <span style="font-size:12.5px;color:var(--n-600);flex:1;">Análise de Algoritmos</span>
        <span style="font-family:var(--fm);font-size:10px;font-weight:600;background:var(--n-100);color:var(--n-400);padding:2px 8px;border-radius:9999px;text-transform:uppercase;letter-spacing:1px;">Premium</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:.45rem;">
        <span style="width:24px;height:24px;border-radius:5px;background:var(--n-300);color:#fff;font-family:var(--fm);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;">F2</span>
        <span style="font-size:12.5px;color:var(--n-600);flex:1;">Algoritmos e Est. de Dados</span>
        <span style="font-family:var(--fm);font-size:10px;font-weight:600;background:var(--n-100);color:var(--n-400);padding:2px 8px;border-radius:9999px;text-transform:uppercase;letter-spacing:1px;">Premium</span>
      </div>
    </div>
  </div>
</div></body></html>
