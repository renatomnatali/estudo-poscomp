<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <span class="eyebrow">Components · Progress</span>
  <div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
      <span style="font-size:11.5px;font-family:var(--fm);color:var(--fg-4);">Linguagens Formais — F6</span>
      <span class="tabular" style="font-size:11.5px;color:var(--em);font-weight:700;font-family:var(--fb);">33%</span>
    </div>
    <div style="height:6px;background:var(--n-100);border-radius:3px;overflow:hidden;"><div style="height:100%;width:33%;background:var(--grad-progress);border-radius:3px;"></div></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;background:var(--ink);padding:12px 14px;border-radius:12px;">
    <span style="font-size:11.5px;font-family:var(--fm);color:rgba(255,255,255,.4);">Progresso</span>
    <div style="flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:2px;"><div style="height:100%;width:33%;background:var(--grad-progress);border-radius:2px;"></div></div>
    <span class="tabular" style="font-size:11.5px;font-family:var(--fb);color:var(--em);font-weight:700;">33%</span>
  </div>
  <div style="display:flex;gap:18px;align-items:center;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--em);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;">✓</div>
      <small style="font-size:10px;font-family:var(--fm);color:var(--em-d);text-transform:uppercase;letter-spacing:1px;">Concluído</small>
    </div>
    <div style="height:1px;flex:0 0 22px;background:var(--n-200);"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--sap);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:14px;box-shadow:0 2px 10px rgba(27,63,216,.25);">2</div>
      <small style="font-size:10px;font-family:var(--fm);color:var(--sap-d);text-transform:uppercase;letter-spacing:1px;">Atual</small>
    </div>
    <div style="height:1px;flex:0 0 22px;background:var(--n-200);"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--n-100);color:var(--n-400);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:14px;border:1px solid var(--n-200);">3</div>
      <small style="font-size:10px;font-family:var(--fm);color:var(--n-400);text-transform:uppercase;letter-spacing:1px;">Trancado</small>
    </div>
  </div>
</div></body></html>
